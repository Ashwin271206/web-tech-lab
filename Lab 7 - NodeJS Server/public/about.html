<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: Arial, sans-serif; background: #f5f5f5; color: #333;
    }
    .container {
      text-align: center; background: white; padding: 45px;
      width: 90%; max-width: 550px; border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-bottom: 15px; color: #333; }
    p {
      color: #666; margin-bottom: 25px; font-size: 17px;
      line-height: 1.5;
    }
    a {
      display: inline-block; padding: 11px 22px; background: #333;
      color: white; text-decoration: none; border-radius: 6px;
      transition: 0.2s;
    }
    a:hover { background: #555; }
  </style>
</head>
<body>
  <div class="container">
    <h1>About This Website</h1>
    <p>This is the About page, served by a simple Node.js HTTP server.</p>
    <a href="/">Back to Homepage</a>
  </div>
</body>
</html>
